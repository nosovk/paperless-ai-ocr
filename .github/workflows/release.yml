name: Release container image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: v1.7.12
  GOVULNCHECK_VERSION: v1.7.0
  QEMU_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

concurrency:
  group: release-container-image
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Poppler and process utilities
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils util-linux
      - name: Install pinned verification tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - name: Validate release tag and metadata
        id: release-metadata
        run: bash scripts/release-metadata.sh
      - name: Validate workflow policy
        run: |
          actionlint .github/workflows/ci.yml .github/workflows/release.yml
          python3 scripts/workflow-policy-test.py
          python3 scripts/workflow-policy-regression-test.py
          bash scripts/release-metadata-test.sh
          bash scripts/release-state-test.sh
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Run real Poppler tests explicitly
        run: go test ./internal/pdf -run '^(TestInspectRealPDFs|TestRenderRealPDFOnePage|TestRenderRealPDFRangeAndSequentialReuse)$' -count=1 -v
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Cross-build release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.release-metadata.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.release-metadata.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish multi-architecture image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.final-digest.outputs.digest }}
    steps:
      - name: Checkout verified tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag and metadata before publication
        id: release-metadata
        run: bash scripts/release-metadata.sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,manifest-descriptor,index
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release-metadata.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.release-metadata.outputs.version }}
          labels: |
            org.opencontainers.image.created=${{ steps.release-metadata.outputs.created }}
          annotations: |
            org.opencontainers.image.created=${{ steps.release-metadata.outputs.created }}
      - name: Determine release state
        id: release-state
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release-metadata.outputs.version }}
          REVISION: ${{ github.sha }}
        run: bash scripts/release-state.sh
      - name: Build and push image
        id: build
        if: steps.release-state.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.release-metadata.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.release-metadata.outputs.created }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify final release state
        id: final-state
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release-metadata.outputs.version }}
          REVISION: ${{ github.sha }}
        run: bash scripts/release-state.sh
      - name: Resolve final digest
        id: final-digest
        shell: bash
        env:
          PUBLISH: ${{ steps.release-state.outputs.publish }}
          EXISTING_DIGEST: ${{ steps.release-state.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_DIGEST: ${{ steps.final-state.outputs.digest }}
          FINAL_PUBLISH: ${{ steps.final-state.outputs.publish }}
        run: |
          if [[ $FINAL_PUBLISH != false ]]; then
            printf 'final registry state is not fully published\n' >&2
            exit 1
          fi
          digest=$REGISTRY_DIGEST
          if [[ $PUBLISH == true ]]; then
            expected=$BUILT_DIGEST
          else
            expected=$EXISTING_DIGEST
          fi
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'invalid final image digest: %s\n' "$digest" >&2
            exit 1
          fi
          if [[ $digest != "$expected" ]]; then
            printf 'final registry digest %s does not match expected digest %s\n' "$digest" "$expected" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        id: attest
        if: steps.release-state.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.final-digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Summarize release
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.final-digest.outputs.digest }}
          PUBLISH: ${{ steps.release-state.outputs.publish }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            printf '## Published image\n\n'
            printf '`%s@%s`\n\n' "$IMAGE" "$DIGEST"
            if [[ $PUBLISH == true ]]; then
              printf '[GitHub provenance attestation](%s)\n\n' "$ATTESTATION_URL"
            else
              printf 'Existing immutable release tags and image digest were verified; no new provenance attestation was created.\n\n'
            fi
            printf '> Release prerequisite: configure the linked GHCR package as public before advertising anonymous pulls. Package visibility is not controlled by this workflow.\n'
          } >> "$GITHUB_STEP_SUMMARY"
